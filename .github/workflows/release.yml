# Builds the ready-to-use Windows program (MultiCamRecorder.exe) on a clean Windows machine.
#
# - Push a version tag (e.g. v1.0.0, must match APP_VERSION in src/app_info.py):
#   builds the program and publishes a GitHub release with the ZIP file.
# - "Run workflow" button in the Actions tab: only builds; the ZIP can be
#   downloaded from the page of the run (to test before publishing).

name: Build Windows release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # Needed to create the release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      - name: Build program and ZIP
        run: python build_release.py

      - name: Keep the ZIP as a download of this run
        uses: actions/upload-artifact@v4
        with:
          name: MultiCamRecorder-Windows
          path: dist/*.zip

      - name: Publish the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          body: |
            ## Download and use (Windows 10/11, no Python needed)

            1. Basler cameras only: install **Basler pylon** once (camera driver): https://www.baslerweb.com/en/software/pylon/
            2. Download **MultiCamRecorder_${{ github.ref_name }}_Windows.zip** below (under "Assets").
            3. Right-click the ZIP > **Extract All...**, open the folder **MultiCamRecorder** and double-click **MultiCamRecorder.exe**.

            If Windows shows "Windows protected your PC", click **More info** > **Run anyway**
            (the program is not code-signed). Full instructions: README.md inside the ZIP.
